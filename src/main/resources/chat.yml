# ==============================================================================
#                        LOBBYCORE - CHAT CONFIGURATION
# ==============================================================================
# Fully powered by Paper AsyncChatEvent and Kyori Adventure MiniMessage.
# Players with 'lobby.chat.color' can use MiniMessage tags in their messages.
# ==============================================================================

chat:
  # The chat format template.
  # Available placeholders: %player%, %displayname%, %ping%, %world%, %message%
  format: "<gray>[</gray><gradient:#00f2fe:#4facfe>Lobby</gradient><gray>]</gray> <white>%player%</white><dark_gray> »</dark_gray> <gray>%message%</gray>"

anti-swear:
  enabled: true
  # Action to take when a blocked word is detected:
  # MASK  - Replaces the word with ***
  # BLOCK - Completely cancels the message and notifies the sender
  action: "MASK"
  blocked-words:
    - "fuck"
    - "shit"
    - "bitch"
    - "asshole"
    - "nigger"
    - "cunt"
    - "dick"

anti-spam:
  enabled: true
  # Minimum interval in seconds between messages
  cooldown-seconds: 1.5
  # Block sending the identical message consecutively
  block-duplicates: true
