# ==============================================================================
#                       LOBBYCORE - LOBBIES CONFIGURATION
# ==============================================================================
# Define multiple lobby worlds or sub-lobbies with spawn coordinates and limits.
# Auto-balance sends incoming players to the lobby with the fewest players.
# NOTE: Players will NOT be teleported to any lobby until at least one lobby
# is set via /setlobby or the in-game Lobby Worlds Management GUI (/lobbyadmin).
# ==============================================================================

settings:
  default-lobby: ""
  auto-balance: true

lobbies: {}
